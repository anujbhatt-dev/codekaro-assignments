<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Info</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card card-company">
        <div class="emoji">🏬</div>
        <h2 class="h2">Your Company</h2>
        <p class="p-basic">Tell us about your company, You will be able to invite your teammates in the next step.</p><br>
        <div>
            <label class="label-basic label-selected" for="">Company name</label>
            <input  class="input-basic" type="text" placeholder="Enter company name">
        </div>
        <div>
            <label class="label-basic" for="">Industry (optional)</label>
            <select class="select" name="industry" id="">
                <option value="creative-agency">🎨 Creative Agency</option>
                <option value="it">🧑‍💻 IT</option>
                <option value="agri">🌳 Agriculture</option>
            </select>
        </div>
        <div>
            <label class="label-basic" for="">Your role (optional)</label>
            <select class="select" name="role" id="">
                <option value="Owner-founder-ceo">🎯 Owner / Founder / CEO</option>
                <option value="it">👷 Developer</option>
                <option value="agri">👸 HR</option>
            </select>
        </div>
        <div>
            <label class="label-basic" for="">Company size (optional)</label>
            <select class="select" name="size" id="">
                <option value="2-10">2-10</option>
                <option value="11-20">11-20</option>
                <option value="21-30">21-30</option>
            </select>
        </div>
        <button class="btn">Continue</button>
    </div>
    <div class="flex-between">
        <a href="card4.html">Back</a>
        <a href="index.html">Home</a>
    </div>
</body>
</html>
