<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center min-h-screen flex-col gap-10">
    <h1 class="font-bold text-2xl bg-neutral-50 p-3 rounded w-full sm:w-1/3 text-center">
        Your BMI calculator
    </h1>

    <div class="grid gap-6 mb-6 md:grid-cols-1 w-full sm:w-1/3 ">
        <div>
            <label for="weight" class="block mb-2.5 text-sm font-medium text-heading">Weight</label>
            <input type="text" id="weight" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="Enter weight in kgs" required />
        </div>
        <div>
            <label for="height" class="block mb-2.5 text-sm font-medium text-heading">Height</label>
            <input type="text" id="height" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="Enter height in mtrs" required />
        </div>
        <button type="submit" class="text-white bg-black border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none" onclick="calcBMI()">Calculate BMI</button>
        <h1 id="heading" class="flex justify-between p-3 folt-bold text-4xl items-center">
            
        </h1>
    </div>
    <script src="app.js"></script>
</body>
</html>
