<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100vh;
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
        }
        h1{
            font-size: 1rem;
            text-align: center;
            padding: 1rem;
            background-color: coral;
            color: white;
            font-weight: bold;
            width: 100%;
            margin: 0;
        }
        div{
            display: flex;
            flex-direction: column;
            gap:1rem;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        p{
            font-size: 1.5rem;
            background-color: #ffffff;  
            color: black;
            padding: 1rem 2rem;      
            border-radius: 10px;  
            height: 5rem;
            width: 5rem;  
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button{
            padding: 1rem 2rem;
            color: white;
            background-color: black;
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body id="body">
    <h1 id="h1">
        Click the Button to Change the Background Color!
    </h1>
    <div id="div">
        <p  id="currentColor"></p>
        <button id="btn" onclick="changeColor()">Change Color</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
