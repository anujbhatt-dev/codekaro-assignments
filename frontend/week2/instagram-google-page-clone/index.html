<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar__top">
            <img class="sidebar__svg" src="instagram.svg" alt="This is a instagram logo">
        </div>
        <div class="sidebar__mid">
            <img class="sidebar__svg" src="home.svg" alt="This is a instagram logo">
            <img class="sidebar__svg" src="reels.svg" alt="This is a instagram logo">
            <div class="relative">
                <img class="sidebar__svg" src="messages.svg" alt="This is a instagram logo">
                <p class="batch batch-bottom-right">2</p>
            </div>
            <img class="sidebar__svg" src="search.svg" alt="This is a instagram logo">
            <div class="relative">
                <img class="sidebar__svg" src="notifications.svg" alt="This is a instagram logo">
                <p class="batch batch-top-right batch-heart"></p>
            </div>
            <img class="sidebar__svg" src="new-post.svg" alt="This is a instagram logo">
            <img class="sidebar__svg" src="professional-dashboard.svg" alt="This is a instagram logo">  
            <img class="sidebar__svg sidebar__img" src=https://images.unsplash.com/photo-1734898055069-979dca4929ee?q=80&w=1480&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="This is a instagram logo">          
        </div>
        <div class="sidebar__bottom">
            <img class="sidebar__svg" src="settings.svg" alt="This is a instagram logo">
            <img class="sidebar__svg" src="also-from-meta.svg" alt="This is a instagram logo">
        </div>
    </aside>

    <!-- Fixed Messages -->
     <div class="fixed messages">
        <div class="relative">
            <img class="sidebar__svg" src="messages.svg" alt="This is a instagram logo">
            <p class="batch batch-bottom-right">2</p>
        </div>
        <p class="messages__text">Messages</p>
        <div class="messages__img">
            <img class="sidebar__svg sidebar__img" src="http://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=1061&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="This is a instagram logo">
            <img class="sidebar__svg sidebar__img" src="https://images.unsplash.com/photo-1579176647030-bd86f6fd4e1e?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="This is a instagram logo">
            <img class="sidebar__svg sidebar__img" src="https://images.unsplash.com/photo-1628563694622-5a76957fd09c?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="This is a instagram logo">
        </div>
     </div>

     <!-- Main  -->
     <main>
           <!-- Account Information Block -->
            <section class="wrapper">
                <div class="profile">
                    <img src="google-logo.jpg" alt="this is a google logo">
                </div>
                <div class="info">
                    <p class="info__username"><span>google</span> <span><img src="verified.svg" alt=""></span> <span><img src="options.svg" alt=""></span></p>
                    <p class="info__name">Google</p>
                    <div class="info__stats">
                        <p><strong>3,338</strong> posts</p>
                        <p><strong>15.4M</strong> followers</p>
                        <p><strong>45</strong> following</p>
                    </div>
                    <p class="info__niche">Internet company</p>
                    <div class="info__bio">Here to help</div>
                    <div class="info__links">
                        <a href="https://l.instagram.com/?u=https%3A%2F%2Flinkin.bio%2Fgoogle%3Futm_source%3Dig%26utm_medium%3Dsocial%26utm_content%3Dlink_in_bio%26fbclid%3DPAcGRvZgJleHRuA2FlbQIxMQBzcnRjBmFwcF9pZA85MzY2MTk3NDMzOTI0NTkAAaeIHNQLH9ed6gz0uwClrubjyh4FJVrY_KtzUpOwUHyIF3c6t7LIvVGt3WYyfg_aem_V0KIVBV3ipRmjtwc5hFqTw&e=AUAdWE1g339C_NJ8RnjPfkz9MmQJbmkTa8XS1Nc09ZFVDMxhPCZ_T7MRyhwQc4JHMT9HFxFUzFadEtSBTKT7cUj6EY7chse5CpiiKaY0v0L91Farvvo820DYNrMlQBP61tn5b09qP1eKNGjfiTcS9TL9iEma"><img src="link-icon.svg" alt=""> linkin.bio/google</a>
                        <a href=""><img src="threads.svg" alt=""> google</a>
                    </div>
                    <div class="info__mutuals">            
                        <div class="messages__img">
                            <img class="sidebar__svg sidebar__img" src="http://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=1061&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="This is a instagram logo">
                            <img class="sidebar__svg sidebar__img" src="https://images.unsplash.com/photo-1579176647030-bd86f6fd4e1e?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="This is a instagram logo">
                            <img class="sidebar__svg sidebar__img" src="https://images.unsplash.com/photo-1628563694622-5a76957fd09c?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="This is a instagram logo">
                        </div>
                        <p>
                            Followed by <strong>zaman_ehsani, anushka_</strong> + 16 more
                        </p>
                    </div>
                </div>
            </section>

            <!-- CTAs -->
            <section class="wrapper wrapper-cta">
                <button class="btn btn-blue">Follow</button>
                <button class="btn">Message</button>
                <button class="btn"><img src="similar-accounts.svg" alt=""></button>
            </section>

            <!-- highlights -->
             <section class="wrapper">
                <div class="highlights profile">
                    <img src="io.jpg" alt="this is a google logo">
                    <p class="info__name">
                        Google I/O
                    </p>
                </div>

             </section>

             <!-- tabs -->
             <section class="tabs">
                <img src="posts.svg" alt="" class="tab__posts"><img src="reels.svg" alt="" class="tab__reels"><img src="reposts.svg" alt="" class="tab__reposts"><img src="tagged.svg" alt="" class="tab__tagged">
             </section>

             <!-- grid -->
            <section class="grid">
                <div class="grid__cell">
                    <img src="https://images.unsplash.com/photo-1582561424760-0321d75e81fa?q=80&w=1089&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                    <img class="clip" src="clip.svg" alt="">
                    <div class="overlay">
                        <p>&hearts; 1234</p>
                    </div>
                </div>
                <div class="grid__cell">
                    <img src="https://images.unsplash.com/flagged/photo-1572392640988-ba48d1a74457?q=80&w=1064&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                    <img class="clip" src="carousel.svg" alt="">
                    <div class="overlay">
                        <p>&hearts; 1234</p>
                    </div>
                </div>
                <div class="grid__cell">
                    <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=1045&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                    <img class="clip" src="clip.svg" alt="">
                    <div class="overlay">
                        <p>&hearts; 1234</p>
                    </div>
                </div>
                <div class="grid__cell">
                    <img src="https://images.unsplash.com/photo-1579783928621-7a13d66a62d1?q=80&w=990&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                    <img class="clip" src="carousel.svg" alt="">
                    <div class="overlay">
                        <p>&hearts; 1234</p>
                    </div>
                </div>
                <div class="grid__cell">
                    <img src="https://plus.unsplash.com/premium_photo-1664013263421-91e3a8101259?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                    <img class="clip" src="clip.svg" alt="">
                    <div class="overlay">
                        <p>&hearts; 1234</p>
                    </div>
                </div>
                <div class="grid__cell">
                    <img src="https://images.unsplash.com/photo-1579541814924-49fef17c5be5?q=80&w=970&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                    <img class="clip" src="carousel.svg" alt="">
                    <div class="overlay">
                        <p>&hearts; 1234</p>
                    </div>
                </div>
                <div class="grid__cell">
                    <img src="https://images.unsplash.com/photo-1605721911519-3dfeb3be25e7?q=80&w=1035&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                    <img class="clip" src="clip.svg" alt="">
                    <div class="overlay">
                        <p>&hearts; 1234</p>
                    </div>
                </div>
                <div class="grid__cell">
                    <img src="https://images.unsplash.com/photo-1579762715118-a6f1d4b934f1?q=80&w=984&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                    <img class="clip" src="carousel.svg" alt="">
                    <div class="overlay">
                        <p>&hearts; 1234</p>
                    </div>
                </div>
                
                
            </section>
     </main> 
</body>
</html>
