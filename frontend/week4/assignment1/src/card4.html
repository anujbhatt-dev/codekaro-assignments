<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Details</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#eeedf0] px-4 font-sans tracking-[0.1px]">
    <div class="mx-auto mt-24 bg-white w-full max-w-[450px] rounded-[18px] px-6 py-12 text-center sm:px-10">
        <p class="text-[40px]">💳</p>
        <h2 class="text-2xl font-semibold">Card details</h2>
        <p class="mt-2.5 text-sm leading-6 text-gray-500">Enter you card details to kick-start your free trail. Don't worry, you won't be charged a dime until your trail ends in <strong>7 days.</strong></p>
        <div class="grid mt-8 w-full grid-cols-[1fr_6fr_3fr_2fr] items-center gap-0.5 rounded-[10px] overflow-hidden border-2 border-gray-500/15 px-2.5 py-3.5 text-center text-sm">
            <p class="text-lg">💳</p>
            <input class="w-full border-0 border-b-2 border-transparent p-1 font-medium outline-none transition-colors duration-300 placeholder:text-gray-400 focus:border-[#7239fe]" type="text" placeholder="Card Number" maxlength="16">
            <input class="w-full p-1 font-medium border-0 border-b-2 border-transparent outline-none transition-colors duration-300 placeholder:text-gray-400 focus:border-[#7239fe]"
             type="text" placeholder="MM/YY" maxlength="5">
            <input class="w-full border-0 border-b-2 border-transparent p-1 font-medium outline-none transition-colors duration-300 placeholder:text-gray-400 focus:border-[#7239fe]" type="text" placeholder="CVV" maxlength="3">
        </div>
        <button class="mt-4 w-full rounded-[10px] bg-[#7239fe] px-10 py-3.5 text-[15px] text-white transition-all duration-300 hover:-translate-y-0.5 hover:bg-[#5f21fc] active:translate-y-0">Stat your 7-day free trail</button>
        <p class="mt-6 text-[11.5px] text-gray-400">🛡️ Secure and encrypted</p>
    </div>
    <div class="mx-auto mt-4 flex w-full max-w-[450px] items-center justify-between rounded-lg bg-white px-8 py-4 sm:px-12">
        <a class="rounded bg-gray-200/60 px-5 py-2.5 text-xs text-black no-underline transition-colors duration-300 hover:bg-black hover:text-white" href="card3.html">Back</a>
        <a class="rounded bg-gray-200/60 px-5 py-2.5 text-xs text-black no-underline transition-colors duration-300 hover:bg-black hover:text-white" href="card5.html">Next</a>
    </div>
</body>
</html>
