<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Info</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#eeedf0] px-4 font-sans tracking-[0.1px]">
    <div class="mt-24 mx-auto w-full max-w-[450px] bg-white rounded-[18px] py-12 px-6 text-center sm:px-10">
        <div class="text-[40px]">🏬</div>
        <h2 class="mt-2.5 text-[32px] font-semibold">Your Company</h2>
        <p class="mt-2.5 text-sm leading-6 text-gray-500">Tell us about your company, You will be able to invite your teammates in the next step.</p>
        <div>
            <label class="mt-8 ml-1 block text-left text-xs font-medium text-[#7239fe]" for="company-name">Company name</label>
            <input id="company-name" class="w-full mt-2 rounded-[10px] border-2 border-gray-500/15 py-3.5 px-2.5 text-left text-sm outline-3 outline-transparent transition-all duration-300 placeholder:text-gray-500 focus:border-[#7239fe] focus:outline-gray-500/15"
             type="text" placeholder="Enter company name">
        </div>
        <div>
            <label class="mt-4 ml-1 block text-left text-xs text-gray-500" for="industry">Industry (optional)</label>
            <select class="mt-2 w-full rounded-[10px] border-2 border-gray-500/15 px-2.5 py-3.5 text-left text-sm outline-3 outline-transparent focus:border-[#7239fe]" name="industry" id="industry">
                <option value="creative-agency">🎨 Creative Agency</option>
                <option value="it">🧑‍💻 IT</option>
                <option value="agri">🌳 Agriculture</option>
            </select>
        </div>
        <div>
            <label class="mt-4 ml-1 block text-left text-xs text-gray-500" for="role">Your role (optional)</label>
            <select class="w-full mt-2 border-2 border-gray-500/15 rounded-[10px] px-2.5 py-3.5 text-left text-sm outline-3 outline-transparent focus:border-[#7239fe]" name="role" id="role">
                <option value="Owner-founder-ceo">🎯 Owner / Founder / CEO</option>
                <option value="it">👷 Developer</option>
                <option value="agri">👸 HR</option>
            </select>
        </div>
        <div>
            <label class="mt-4 ml-1 block text-left text-xs text-gray-500" for="size">Company size (optional)</label>
            <select class="mt-2 w-full rounded-[10px] border-2 border-gray-500/15 px-2.5 py-3.5 text-left text-sm outline-3 outline-transparent focus:border-[#7239fe]" name="size" id="size">
                <option value="2-10">2-10</option>
                <option value="11-20">11-20</option>
                <option value="21-30">21-30</option>
            </select>
        </div>
        <button class="mt-4 w-full rounded-[10px] bg-[#7239fe] px-10 py-3.5 text-[15px] text-white transition-all duration-300 hover:-translate-y-0.5 hover:bg-[#5f21fc] active:translate-y-0">Continue</button>
    </div>
    <div class="mx-auto mt-4 flex w-full max-w-[450px] items-center justify-between rounded-lg bg-white px-8 py-4 sm:px-12">
        <a class="rounded bg-gray-200/60 px-5 py-2.5 text-xs text-black no-underline transition-colors duration-300 hover:bg-black hover:text-white" href="card4.html">Back</a>
        <a class="rounded bg-gray-200/60 px-5 py-2.5 text-xs text-black no-underline transition-colors duration-300 hover:bg-black hover:text-white" href="index.html">Home</a>
    </div>
</body>
</html>
